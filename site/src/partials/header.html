<header class="sticky top-0 z-50 border-b border-gray-800 bg-gray-950/90 backdrop-blur-xl">
    <div class="mx-auto w-full max-w-7xl px-6">
        <div class="flex h-16 items-center justify-between gap-4">
            <a href="/" class="flex shrink-0 items-center gap-2" aria-label="Referlyst home">
                <img src="/images/referlyst-logo.svg" alt="Referlyst" class="h-8 w-auto" width="160" height="52" fetchpriority="high">
            </a>
            <nav class="hidden items-center gap-8 md:flex" aria-label="Main">
                <a href="/" class="text-sm font-medium text-gray-400 transition-colors hover:text-white">Home</a>
                <a href="/features" class="text-sm font-medium text-gray-400 transition-colors hover:text-white">Features</a>
                <a href="/pricing" class="text-sm font-medium text-gray-400 transition-colors hover:text-white">Pricing</a>
                <a href="/faq" class="text-sm font-medium text-gray-400 transition-colors hover:text-white">FAQ</a>
            </nav>
            <div class="hidden items-center gap-3 md:flex">
                <a data-app-path="/referral/login" href="#" class="text-sm font-medium text-gray-400 transition-colors hover:text-white">Log in</a>
                <a data-app-path="/referral/register" href="#" class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-6 py-3 text-sm font-medium text-white shadow-lg shadow-blue-500/20 transition-all duration-200 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-950">Get Started</a>
            </div>
            <div class="flex items-center gap-2 md:hidden">
                <a data-app-path="/referral/login" href="#" class="text-sm font-medium text-gray-400">Log in</a>
                <button type="button" @click="$store.mobileNav.open = ! $store.mobileNav.open" class="inline-flex items-center justify-center rounded-lg p-2 text-gray-400 transition-colors hover:bg-gray-800 hover:text-white" aria-label="Toggle menu" x-data :aria-expanded="$store.mobileNav.open">
                    <svg x-show="!$store.mobileNav.open" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                    <svg x-show="$store.mobileNav.open" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true" x-cloak>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <div x-data x-show="$store.mobileNav.open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" x-cloak class="border-t border-gray-800 bg-gray-950/95 backdrop-blur-xl md:hidden" @click.outside="$store.mobileNav.open = false">
        <nav class="space-y-1 px-6 py-4" aria-label="Mobile">
            <a href="/" class="block rounded-lg px-4 py-3 text-sm font-medium text-gray-300 hover:bg-gray-800/80 hover:text-white">Home</a>
            <a href="/features" class="block rounded-lg px-4 py-3 text-sm font-medium text-gray-300 hover:bg-gray-800/80 hover:text-white">Features</a>
            <a href="/pricing" class="block rounded-lg px-4 py-3 text-sm font-medium text-gray-300 hover:bg-gray-800/80 hover:text-white">Pricing</a>
            <a href="/faq" class="block rounded-lg px-4 py-3 text-sm font-medium text-gray-300 hover:bg-gray-800/80 hover:text-white">FAQ</a>
            <a data-app-path="/referral/register" href="#" class="block rounded-lg px-4 py-3 text-sm font-medium text-emerald-400 hover:bg-gray-800/80">Get Started</a>
        </nav>
    </div>
</header>
<main class="grow">
